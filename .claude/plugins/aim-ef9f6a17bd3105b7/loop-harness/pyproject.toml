[project]
name = "loop-harness"
dynamic = ["version"]
description = "An evidence-verified ticket loop for Claude Code: the model proposes, the harness verifies, git is ground truth."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
loopctl = "loop_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: the Claude Code plugin manifest.
# The release-claude-code-plugin skill bumps plugin.json; this derives the
# installable package version from it, so the two never drift.
[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/loop_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Claude Code vendors other plugins/agents/skills into .claude/ when the repo
# is opened as a workspace; that third-party code is not ours to lint.
extend-exclude = [".claude"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/loop_harness", "tests", "scripts"]
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
