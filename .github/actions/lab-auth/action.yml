name: lab-auth
description: >-
  Put the calling job on the lab tailnet as an ephemeral tag:ci node and log it
  in to Vault with the job's GitHub OIDC token. The calling job needs
  `permissions: id-token: write` and `environment: lab`.

inputs:
  vault-role:
    description: Vault role on the jwt-github mount, a key of var.vault_ci_callers.
    required: true
  vault-addr:
    description: Vault address, reached through the tailnet's subnet route.
    default: https://vault.lab.orangecluster.nl
  vault-mount:
    description: Path of Vault's JWT auth mount for GitHub tokens.
    default: jwt-github
  tags:
    description: Tailscale tags the runner joins with.
    default: tag:ci
  tailscale-client-id:
    description: >-
      Client ID of a Tailscale federated identity. Not a secret. Leave empty to
      pick the identity that matches the job's OIDC subject format.
    default: ''
  tailscale-audience:
    description: >-
      Audience that identity expects. Leave empty for api.tailscale.com/<client ID>.
    default: ''

outputs:
  vault-addr:
    description: The Vault address, also exported as VAULT_ADDR.
    value: ${{ inputs.vault-addr }}
  vault-token:
    description: A Vault token that expires within minutes, also exported as VAULT_TOKEN.
    value: ${{ steps.login.outputs.vault-token }}

runs:
  using: composite
  steps:
    # Repositories created after 2026-07-15 get GitHub's immutable OIDC
    # subject (repo:JasperHG90@8079803/...), which the older identity's
    # subject (repo:JasperHG90/*:environment:lab) cannot match, so each
    # format has its own identity. See ADR 0031.
    - id: tailscale-identity
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.tailscale-client-id }}
        AUDIENCE: ${{ inputs.tailscale-audience }}
      run: |
        set -euo pipefail
        if [ -z "$CLIENT_ID" ]; then
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?the calling job needs permissions: id-token: write}"
          # An audience nothing trusts: this token is only read, never sent.
          jwt=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lab-auth-subject-only" | jq -er '.value // empty') || {
            echo "::error::GitHub returned no OIDC token to read the subject from"
            exit 1
          }
          echo "::add-mask::$jwt"
          payload=$(cut -d. -f2 <<<"$jwt" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          sub=$(base64 -d <<<"$payload" | jq -er '.sub')
          if [[ "$sub" == repo:JasperHG90@8079803/* ]]; then
            CLIENT_ID=T4Y1pq366F11CNTRL-kysCUqvnvH11CNTRL
          else
            CLIENT_ID=T4Y1pq366F11CNTRL-kcbC29ubym11CNTRL
          fi
        fi
        echo "client-id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
        echo "audience=${AUDIENCE:-api.tailscale.com/$CLIENT_ID}" >> "$GITHUB_OUTPUT"

    # v4 accepts subnet routes by itself, which reaching the lab needs. No
    # `args`: repeating that flag there makes `tailscale up` fail.
    - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
      with:
        oauth-client-id: ${{ steps.tailscale-identity.outputs.client-id }}
        audience: ${{ steps.tailscale-identity.outputs.audience }}
        tags: ${{ inputs.tags }}

    - id: login
      shell: bash
      env:
        VAULT_ADDR: ${{ inputs.vault-addr }}
        VAULT_MOUNT: ${{ inputs.vault-mount }}
        VAULT_ROLE: ${{ inputs.vault-role }}
      run: |
        set -euo pipefail
        : "${ACTIONS_ID_TOKEN_REQUEST_URL:?the calling job needs permissions: id-token: write}"
        jwt=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vault.io" | jq -er '.value // empty') || {
          echo "::error::GitHub returned no OIDC token for audience vault.io"
          exit 1
        }
        echo "::add-mask::$jwt"
        if ! response=$(jq -n --arg role "$VAULT_ROLE" --arg jwt "$jwt" '{role: $role, jwt: $jwt}' \
          | curl -sS --fail-with-body --data @- "$VAULT_ADDR/v1/auth/${VAULT_MOUNT}/login"); then
          echo "::error::Vault refused role $VAULT_ROLE: $response"
          exit 1
        fi
        token=$(jq -er '.auth.client_token // empty' <<<"$response") || {
          echo "::error::Vault login for role $VAULT_ROLE returned no token"
          exit 1
        }
        echo "::add-mask::$token"
        echo "VAULT_ADDR=$VAULT_ADDR" >> "$GITHUB_ENV"
        echo "VAULT_TOKEN=$token" >> "$GITHUB_ENV"
        echo "vault-token=$token" >> "$GITHUB_OUTPUT"
