name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # nomad-fmt, terraform-fmt and terraform-validate run these from PATH.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: Install Nomad
        env:
          NOMAD_VERSION: 2.0.4
        run: |
          cd "$RUNNER_TEMP"
          base="https://releases.hashicorp.com/nomad/${NOMAD_VERSION}"
          curl -fsSLO "${base}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/nomad_${NOMAD_VERSION}_SHA256SUMS"
          grep "nomad_${NOMAD_VERSION}_linux_amd64.zip" "nomad_${NOMAD_VERSION}_SHA256SUMS" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -o "nomad_${NOMAD_VERSION}_linux_amd64.zip" nomad -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Both roots read this key for their firewall null_resources. validate
      # only needs the file to exist; the real key is read at apply.
      - name: Placeholder SSH key for terraform validate
        run: mkdir -p .ssh && touch .ssh/id_rsa
      - name: Pre-commit hooks
        env:
          # The nomad providers read their address from here; validate needs
          # one but never connects.
          NOMAD_ADDR: http://127.0.0.1:4646
        run: uvx prek@0.5.5 run --all-files --show-diff-on-failure

  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Installs kmctl, runs kmctl check (fails the job on a broken bundle)
      # and kmctl review due, and writes both to the job summary.
      - uses: JasperHG90/kmctl@v0.10.0
