<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loop harness — ledger explorer</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #f7f7f5;
    --bg-hover: #efeeec;
    --text: #37352f;
    --text-muted: #787066;
    --text-faint: #9b9a97;
    --border: #e9e9e7;
    --border-strong: #d3d1cb;
    --navy: #24324a;
    --coral: #ef6f52;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --ready-bg: #e7eef7; --ready-fg: #2b5b8c;
    --in-progress-bg: #fbf3d9; --in-progress-fg: #8a6d1a;
    --done-bg: #e4f2e9; --done-fg: #2f7a4d;
    --blocked-bg: #fbe4e4; --blocked-fg: #a83b3b;
    --dropped-bg: #ededec; --dropped-fg: #787066;
    --card-w: 208px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .topbar img { height: 30px; width: auto; display: block; }
  .topbar .sep { width: 1px; height: 22px; background: var(--border); }
  .topbar .caption { color: var(--text-muted); font-size: 13px; }
  .topbar .count { margin-left: auto; color: var(--text-faint); font-size: 12.5px; }

  /* 3-pane body */
  .layout { display: grid; grid-template-columns: 288px 1fr 340px; min-height: 0; }
  .pane { min-height: 0; overflow: auto; }
  .sidebar { border-right: 1px solid var(--border); background: var(--bg-subtle); padding: 16px 14px; }
  .center { position: relative; background: var(--bg); }
  .detail { border-left: 1px solid var(--border); background: var(--bg); }

  /* Sidebar */
  .search {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 16px;
  }
  .search::placeholder { color: var(--text-faint); }
  .search:focus { outline: none; border-color: var(--navy); }
  .filter-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-faint); margin: 6px 2px 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg);
    border-radius: 999px; padding: 3px 10px; color: var(--text-muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { background: var(--bg-hover); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip[aria-pressed="true"] { border-color: var(--navy); color: var(--text); background: #fff; font-weight: 550; }
  .chip.tag[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  .grouphdr {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-faint); margin: 14px 4px 6px;
  }
  .row {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--text);
  }
  .row:hover { background: var(--bg-hover); }
  .row.selected { background: #fff; box-shadow: inset 0 0 0 1px var(--navy); }
  .row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .row .name { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }

  /* Graph board */
  .board { position: relative; min-width: 100%; min-height: 100%; }
  #edges { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .node {
    position: absolute; z-index: 1; width: var(--card-w);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 12px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
    display: flex; flex-direction: column; gap: 8px;
    transition: box-shadow 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
  }
  .node:hover { box-shadow: 0 3px 10px rgba(15, 15, 15, 0.09); transform: translateY(-1px); }
  .node:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .node.selected { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(36, 50, 74, 0.14); }
  .node .title { display: flex; align-items: flex-start; gap: 8px; }
  .node .stagebar { width: 3px; align-self: stretch; border-radius: 2px; flex: none; min-height: 18px; }
  .node .slug {
    font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text);
    line-height: 1.35; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .node .metarow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .pill {
    font-size: 11px; font-weight: 550; padding: 1px 8px; border-radius: 999px;
    text-transform: lowercase; letter-spacing: 0.01em;
  }
  .tagchip { font-size: 10.5px; padding: 1px 7px; border-radius: 4px; background: var(--bg-hover); color: var(--text-muted); font-family: var(--mono); }
  .g-ready .stagebar, .dot.g-ready { background: var(--ready-fg); }
  .g-in-progress .stagebar, .dot.g-in-progress { background: var(--in-progress-fg); }
  .g-done .stagebar, .dot.g-done { background: var(--done-fg); }
  .g-blocked .stagebar, .dot.g-blocked { background: var(--blocked-fg); }
  .g-dropped .stagebar, .dot.g-dropped { background: var(--dropped-fg); }
  .pill.g-ready { background: var(--ready-bg); color: var(--ready-fg); }
  .pill.g-in-progress { background: var(--in-progress-bg); color: var(--in-progress-fg); }
  .pill.g-done { background: var(--done-bg); color: var(--done-fg); }
  .pill.g-blocked { background: var(--blocked-bg); color: var(--blocked-fg); }
  .pill.g-dropped { background: var(--dropped-bg); color: var(--dropped-fg); }
  .node.g-done, .node.g-dropped { opacity: 0.82; }

  .empty { position: absolute; top: 42%; left: 0; right: 0; text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 0 20px; }

  /* Detail */
  .detail-inner { padding: 20px 20px 40px; }
  .detail .placeholder { color: var(--text-faint); font-size: 13px; padding-top: 30px; text-align: center; }
  .detail h2 { font-family: var(--mono); font-size: 15px; font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
  .detail .sub { color: var(--text-muted); font-size: 12.5px; margin-bottom: 18px; }
  .prop { margin-bottom: 14px; }
  .prop .k { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 4px; }
  .prop .v { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  .prop .v.faint { color: var(--text-faint); font-style: italic; }
  .prop .v.mono { font-family: var(--mono); font-size: 12.5px; }
  .prop .tags { display: flex; flex-wrap: wrap; gap: 5px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .detail {
      position: fixed; top: 0; right: 0; height: 100%; width: 320px; max-width: 88vw;
      transform: translateX(100%); transition: transform 0.16s ease; z-index: 5;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
    }
    .detail.open { transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) { .node, .detail { transition: none; } }
</style>
</head>

<script>
(function () {
  "use strict";
  var nodes = (JSON.parse(document.getElementById("loop-graph-data").textContent).nodes) || [];
  var byId = {};
  nodes.forEach(function (n) { byId[n.slug] = n; });

  var GROUPS = ["ready", "in-progress", "done", "blocked", "dropped"];
  var GROUP_LABEL = { "ready": "ready", "in-progress": "in progress", "done": "done", "blocked": "blocked", "dropped": "dropped" };

  var state = {
    search: "",
    stageOn: { "ready": true, "in-progress": true, "done": false, "blocked": false, "dropped": false },
    tagsOn: {},          // active tag filters (OR); empty object = no tag filter
    selected: null
  };

  var CARD_W = 208, GAP_X = 72, GAP_Y = 20, PAD = 26, CARD_H = 78;
  var board = document.getElementById("board");
  var canvas = document.getElementById("edges");
  var ctx = canvas.getContext("2d");
  var detail = document.getElementById("detail");

  function allTags() {
    var seen = {};
    nodes.forEach(function (n) { (n.tags || []).forEach(function (t) { seen[t] = true; }); });
    return Object.keys(seen).sort();
  }

  function matchesSearch(n) {
    if (!state.search) return true;
    var q = state.search.toLowerCase();
    var hay = [n.slug, n.summary || "", n.epic || ""].concat(n.tags || []).join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }
  function matchesTags(n) {
    var active = Object.keys(state.tagsOn);
    if (!active.length) return true;
    return (n.tags || []).some(function (t) { return state.tagsOn[t]; });
  }
  function isVisible(n) {
    return state.stageOn[n.group] && matchesTags(n) && matchesSearch(n);
  }

  // ---- Sidebar ----------------------------------------------------------
  function makeChip(label, pressed, dotGroup, cls) {
    var b = document.createElement("button");
    b.className = "chip" + (cls ? " " + cls : "");
    b.type = "button";
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    if (dotGroup) {
      var d = document.createElement("span");
      d.className = "dot g-" + dotGroup;
      b.appendChild(d);
    }
    b.appendChild(document.createTextNode(label));
    return b;
  }

  function buildFilters() {
    var stageHost = document.getElementById("stage-filters");
    GROUPS.forEach(function (g) {
      var chip = makeChip(GROUP_LABEL[g], state.stageOn[g], g);
      chip.addEventListener("click", function () {
        state.stageOn[g] = !state.stageOn[g];
        chip.setAttribute("aria-pressed", state.stageOn[g] ? "true" : "false");
        render();
      });
      stageHost.appendChild(chip);
    });
    var tags = allTags();
    if (tags.length) {
      document.getElementById("tags-label").hidden = false;
      var tagHost = document.getElementById("tag-filters");
      tags.forEach(function (t) {
        var chip = makeChip(t, false, null, "tag");
        chip.addEventListener("click", function () {
          if (state.tagsOn[t]) delete state.tagsOn[t]; else state.tagsOn[t] = true;
          chip.setAttribute("aria-pressed", state.tagsOn[t] ? "true" : "false");
          render();
        });
        tagHost.appendChild(chip);
      });
    }
    document.getElementById("search").addEventListener("input", function (e) {
      state.search = e.target.value; render();
    });
  }

  function buildList(vis) {
    var host = document.getElementById("ticket-list");
    host.innerHTML = "";
    var groups = {}, order = [];
    vis.forEach(function (n) {
      var epic = n.epic || "(no epic)";
      if (!groups[epic]) { groups[epic] = []; order.push(epic); }
      groups[epic].push(n);
    });
    order.sort(function (a, b) {
      if (a === "(no epic)") return 1;
      if (b === "(no epic)") return -1;
      return a < b ? -1 : 1;
    });
    order.forEach(function (epic) {
      var h = document.createElement("div");
      h.className = "grouphdr";
      h.textContent = epic;
      host.appendChild(h);
      groups[epic].forEach(function (n) {
        var row = document.createElement("div");
        row.className = "row g-" + n.group + (n.slug === state.selected ? " selected" : "");
        row.tabIndex = 0;
        row.setAttribute("role", "button");
        row.innerHTML = '<span class="dot g-' + n.group + '"></span><span class="name"></span>';
        row.querySelector(".name").textContent = n.slug;
        row.title = n.slug;
        row.addEventListener("click", function () { select(n.slug, true); });
        row.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.slug, true); }
        });
        host.appendChild(row);
      });
    });
  }

  // ---- Graph ------------------------------------------------------------
  function depthOf(node, visSet, memo, visiting) {
    if (memo[node.slug] !== undefined) return memo[node.slug];
    if (visiting[node.slug]) return 0;
    visiting[node.slug] = true;
    var d = 0;
    (node.dependencies || []).forEach(function (dep) {
      if (visSet[dep]) d = Math.max(d, depthOf(byId[dep], visSet, memo, visiting) + 1);
    });
    visiting[node.slug] = false;
    memo[node.slug] = d;
    return d;
  }

  function layout(vis, visSet) {
    var memo = {}, visiting = {};
    var sorted = vis.slice().sort(function (a, b) {
      var ao = a.order == null ? Infinity : a.order, bo = b.order == null ? Infinity : b.order;
      if (ao !== bo) return ao - bo;
      return a.slug < b.slug ? -1 : 1;
    });
    var rows = {}, pos = {}, maxCol = 0, maxY = 0;
    sorted.forEach(function (n) {
      var col = depthOf(n, visSet, memo, visiting);
      var row = rows[col] || 0; rows[col] = row + 1;
      var x = PAD + col * (CARD_W + GAP_X);
      var y = PAD + row * (CARD_H + GAP_Y);
      pos[n.slug] = { x: x, y: y };
      maxCol = Math.max(maxCol, col); maxY = Math.max(maxY, y);
    });
    return { pos: pos, width: PAD * 2 + (maxCol + 1) * CARD_W + maxCol * GAP_X, height: maxY + CARD_H + PAD };
  }

  function cssEsc(s) { return s.replace(/["\\]/g, "\\$&"); }

  function drawEdges(vis, lay, visSet) {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = lay.width * dpr; canvas.height = lay.height * dpr;
    canvas.style.width = lay.width + "px"; canvas.style.height = lay.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, lay.width, lay.height);
    var heightById = {};
    vis.forEach(function (n) {
      var el = board.querySelector('[data-slug="' + cssEsc(n.slug) + '"]');
      heightById[n.slug] = el ? el.offsetHeight : CARD_H;
    });
    vis.forEach(function (n) {
      (n.dependencies || []).forEach(function (dep) {
        if (!visSet[dep]) return;
        var hot = state.selected === n.slug || state.selected === dep;
        var from = lay.pos[n.slug], to = lay.pos[dep];
        var x1 = from.x, y1 = from.y + heightById[n.slug] / 2;
        var x2 = to.x + CARD_W, y2 = to.y + heightById[dep] / 2;
        var midx = (x1 + x2) / 2;
        ctx.strokeStyle = hot ? "#24324a" : "#d3d1cb";
        ctx.fillStyle = hot ? "#24324a" : "#d3d1cb";
        ctx.lineWidth = hot ? 2 : 1.3;
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.bezierCurveTo(midx, y1, midx, y2, x2, y2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x2, y2); ctx.lineTo(x2 + 8, y2 - 4); ctx.lineTo(x2 + 8, y2 + 4); ctx.closePath(); ctx.fill();
      });
    });
  }

  function buildBoard(vis, visSet) {
    Array.prototype.slice.call(board.querySelectorAll(".node, .empty")).forEach(function (el) { el.remove(); });
    if (!vis.length) {
      canvas.width = canvas.height = 0;
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = nodes.length ? "No tickets match the current filters." : "The ledger has no tickets yet.";
      board.appendChild(e);
      return;
    }
    var lay = layout(vis, visSet);
    board.style.width = lay.width + "px";
    board.style.height = lay.height + "px";
    vis.forEach(function (n) {
      var p = lay.pos[n.slug];
      var el = document.createElement("div");
      el.className = "node g-" + n.group + (n.slug === state.selected ? " selected" : "");
      el.style.left = p.x + "px"; el.style.top = p.y + "px";
      el.setAttribute("data-slug", n.slug);
      el.tabIndex = 0; el.setAttribute("role", "button");
      var tagsHtml = (n.tags || []).slice(0, 3).map(function () { return '<span class="tagchip"></span>'; }).join("");
      el.innerHTML =
        '<div class="title"><span class="stagebar"></span><span class="slug"></span></div>' +
        '<div class="metarow"><span class="pill g-' + n.group + '"></span>' + tagsHtml + '</div>';
      el.querySelector(".slug").textContent = n.slug;
      el.querySelector(".slug").title = n.slug;
      el.querySelector(".pill").textContent = GROUP_LABEL[n.group];
      var chips = el.querySelectorAll(".tagchip");
      (n.tags || []).slice(0, 3).forEach(function (t, i) { chips[i].textContent = t; });
      el.addEventListener("click", function () { select(n.slug, false); });
      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.slug, false); }
      });
      board.appendChild(el);
    });
    drawEdges(vis, lay, visSet);
  }

  // ---- Detail -----------------------------------------------------------
  function textVal(v) {
    if (v === null || v === undefined || v === "") return null;
    if (Array.isArray(v)) return v.length ? v : null;
    return String(v);
  }
  function addProp(host, key, value, opts) {
    opts = opts || {};
    var wrap = document.createElement("div"); wrap.className = "prop";
    var k = document.createElement("div"); k.className = "k"; k.textContent = key; wrap.appendChild(k);
    var v = document.createElement("div"); v.className = "v" + (opts.mono ? " mono" : "");
    var val = textVal(value);
    if (val === null) { v.classList.add("faint"); v.textContent = "—"; }
    else if (opts.tags) {
      v.classList.add("tags");
      val.forEach(function (t) { var c = document.createElement("span"); c.className = "tagchip"; c.textContent = t; v.appendChild(c); });
    } else if (Array.isArray(val)) { v.textContent = val.join(", "); }
    else { v.textContent = val; }
    wrap.appendChild(v); host.appendChild(wrap);
  }

  function renderDetail() {
    var host = document.getElementById("detail-inner");
    host.innerHTML = "";
    var n = state.selected ? byId[state.selected] : null;
    if (!n) {
      var p = document.createElement("div"); p.className = "placeholder";
      p.textContent = "Select a ticket to see its details."; host.appendChild(p);
      return;
    }
    var h = document.createElement("h2"); h.textContent = n.slug; host.appendChild(h);
    var sub = document.createElement("div"); sub.className = "sub";
    sub.textContent = GROUP_LABEL[n.group] + (n.epic ? " · " + n.epic : ""); host.appendChild(sub);
    addProp(host, "summary", n.summary);
    addProp(host, "tags", n.tags, { tags: true });
    addProp(host, "stage", n.stage);
    addProp(host, "priority", n.priority);
    addProp(host, "depends on", n.dependencies);
    addProp(host, "attempts", n.attempts);
    addProp(host, "review cycles", n.review_cycles);
    addProp(host, "blocker", n.blocker ? n.blocker.code + " — " + n.blocker.reason : null);
    addProp(host, "commit", n.commit_sha, { mono: true });
    addProp(host, "review verdict", n.review_verdict, { mono: true });
    addProp(host, "pick order", n.order == null ? null : n.order + 1);
    addProp(host, "dropped", n.dropped ? "yes" : "no");
  }

  function select(slug, fromSidebar) {
    state.selected = state.selected === slug ? null : slug;
    render();
    if (state.selected) {
      detail.classList.add("open");
      if (!fromSidebar) return;
      var el = board.querySelector('[data-slug="' + cssEsc(slug) + '"]');
      if (el) el.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
    } else {
      detail.classList.remove("open");
    }
  }

  // ---- Render orchestration --------------------------------------------
  function render() {
    var vis = nodes.filter(isVisible);
    var visSet = {}; vis.forEach(function (n) { visSet[n.slug] = true; });
    if (state.selected && !visSet[state.selected]) { state.selected = null; detail.classList.remove("open"); }
    document.getElementById("count").textContent = vis.length + " of " + nodes.length + " tickets";
    buildList(vis);
    buildBoard(vis, visSet);
    renderDetail();
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && state.selected) select(state.selected, false);
  });
  buildFilters();
  render();
})();
</script>
</body>
</html>
