exclude: '^\.(claude|loop)/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: nomad-fmt
        name: Nomad Format (fmt -recursive)
        entry: nomad fmt -recursive
        language: system
        types: [hcl]
        files: '\.hcl$'
      - id: terraform-fmt
        name: Terraform Format (fmt -check -recursive)
        entry: terraform fmt -check -recursive
        language: system
        types: [terraform]
        pass_filenames: false
      - id: terraform-validate
        name: Terraform Validate (per root)
        entry: scripts/tf_validate.sh
        language: system
        types: [terraform]
        pass_filenames: false
      # Python gates for cli/. Versions are pinned once, by cli/pyproject.toml
      # and cli/uv.lock -- deliberately NOT by an upstream `rev`, which would
      # be a second pin that drifts.
      - id: ruff
        name: Ruff (lint)
        entry: uv run --project cli ruff check --force-exclude
        language: system
        # `types: [python]` is required, not tidiness. pre-commit defaults to
        # `types: [file]`, so `files:` alone would hand ruff
        # cli/uv.lock and cli/justfile and go red on both.
        types: [python]
        files: '^(cli|scripts)/'
      - id: ruff-format
        name: Ruff (format)
        entry: uv run --project cli ruff format --check --force-exclude
        language: system
        types: [python]
        files: '^(cli|scripts)/'
      - id: mypy
        name: Mypy (strict, cli/)
        # --config-file is required. ruff and pytest walk up from their
        # arguments and find cli/pyproject.toml; mypy reads config from the
        # cwd only, and Q1 leaves no root manifest -- so without this it logs
        # `Config File: Default` and silently drops `strict = true`.
        entry: uv run --project cli mypy --config-file cli/pyproject.toml cli/src cli/tests scripts
        language: system
        # NO `types: [python]` here. This hook is pass_filenames:false, so the
        # filter buys nothing and costs coverage: a commit touching only
        # cli/pyproject.toml or cli/uv.lock would skip it, and flipping
        # `strict = true` to `false` would commit ungated.
        files: '^(cli|scripts)/'
        pass_filenames: false
