exclude: '^\.(claude|loop)/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: nomad-fmt
        name: Nomad Format (fmt -recursive)
        entry: nomad fmt -recursive
        language: system
        types: [hcl]
        files: '\.hcl$'
      - id: terraform-fmt
        name: Terraform Format (fmt -check -recursive)
        entry: terraform fmt -check -recursive
        language: system
        types: [terraform]
        pass_filenames: false
      - id: terraform-validate
        name: Terraform Validate (per root)
        entry: scripts/tf_validate.sh
        language: system
        types: [terraform]
        pass_filenames: false
      # Python gates for cli/. Versions are pinned once, by cli/pyproject.toml
      # and cli/uv.lock -- deliberately NOT by an upstream `rev`, which would
      # be a second pin that drifts.
      - id: ruff
        name: Ruff (lint)
        entry: uv run --project cli ruff check --force-exclude
        language: system
        # `types: [python]` is required, not tidiness. pre-commit defaults to
        # `types: [file]`, so `files:` alone would hand ruff
        # cli/uv.lock and cli/justfile and go red on both.
        types: [python]
        files: '^(cli|scripts)/'
      - id: ruff-format
        name: Ruff (format)
        entry: uv run --project cli ruff format --check --force-exclude
        language: system
        types: [python]
        files: '^(cli|scripts)/'
      - id: mypy
        name: Mypy (strict, cli/)
        # --config-file is required. ruff and pytest walk up from their
        # arguments and find cli/pyproject.toml; mypy reads config from the
        # cwd only, and Q1 leaves no root manifest -- so without this it logs
        # `Config File: Default` and silently drops `strict = true`.
        entry: uv run --project cli mypy --config-file cli/pyproject.toml cli/src cli/tests scripts
        language: system
        # NO `types: [python]` here. This hook is pass_filenames:false, so the
        # filter buys nothing and costs coverage: a commit touching only
        # cli/pyproject.toml or cli/uv.lock would skip it, and flipping
        # `strict = true` to `false` would commit ungated.
        files: '^(cli|scripts)/'
        pass_filenames: false
      - id: tf-block-diff-self-test
        name: tf_block_diff self-test
        # scripts/ holds no pytest project, so the tool carries its own cases.
        # They are the only thing standing behind its guarantee that a
        # reorganization moved every block without editing one.
        entry: python3 scripts/tf_block_diff.py --self-test
        language: system
        files: '^scripts/tf_block_diff\.py$'
        pass_filenames: false
      - id: oauth2-proxy-guard
        name: oauth2-proxy carries no auth exemption
        # Fires on the jobspec itself, not just on the checker: the commit
        # that would add an exemption is a commit to oauth2-proxy.hcl, and
        # dash-backend-pytest is scoped to the backend directory so it would
        # not run on one.
        entry: python3 scripts/check_oauth2_proxy_guard.py
        language: system
        files: '^(deployments/infrastructure/services/oauth2-proxy(-registry-ui|-openviking)?\.hcl|scripts/check_oauth2_proxy_guard\.py)$'
        pass_filenames: false
      - id: oauth2-proxy-guard-self-test
        name: oauth2-proxy guard self-test
        entry: python3 scripts/check_oauth2_proxy_guard.py --self-test
        language: system
        files: '^scripts/check_oauth2_proxy_guard\.py$'
        pass_filenames: false
      - id: openviking-config-guard
        name: openviking config holds its measured values
        # Fires on the jobspec, not just the checker: the config lives in a
        # Nomad template there, so the commit that would drift the dimension
        # or the rerank target is a commit to openviking.hcl.
        entry: python3 scripts/check_openviking_config.py
        language: system
        files: '^(deployments/applications/services/openviking\.hcl|scripts/check_openviking_config\.py)$'
        pass_filenames: false
      - id: openviking-config-guard-self-test
        name: openviking config guard self-test
        entry: python3 scripts/check_openviking_config.py --self-test
        language: system
        files: '^scripts/check_openviking_config\.py$'
        pass_filenames: false
      - id: pytest
        name: Pytest (cli/)
        entry: uv run --project cli pytest cli/tests
        language: system
        # Same reasoning as mypy: pass_filenames:false, so the filter would
        # only hide the hook when the manifest or lock changes.
        files: '^cli/'
        pass_filenames: false
      # Python gates for the dash backend (deployments/applications/services/dash/backend/).
      # A standalone uv project, not a cli/ subpackage (L3, §11 Q3), so it
      # inherits none of the four hooks above by default -- these mirror them
      # line for line, scoped to its own path. The dash frontend
      # (deployments/applications/services/dash/frontend/) holds no Python
      # at all (L4: static files only), so it needs no hooks here.
      - id: dash-backend-ruff
        name: Ruff (lint, dash backend)
        entry: uv run --project deployments/applications/services/dash/backend ruff check --force-exclude
        language: system
        types: [python]
        files: '^deployments/applications/services/dash/backend/'
      - id: dash-backend-ruff-format
        name: Ruff (format, dash backend)
        entry: uv run --project deployments/applications/services/dash/backend ruff format --check --force-exclude
        language: system
        types: [python]
        files: '^deployments/applications/services/dash/backend/'
      - id: dash-backend-mypy
        name: Mypy (strict, dash backend)
        entry: uv run --project deployments/applications/services/dash/backend mypy --config-file deployments/applications/services/dash/backend/pyproject.toml deployments/applications/services/dash/backend/src deployments/applications/services/dash/backend/tests
        language: system
        files: '^deployments/applications/services/dash/backend/'
        pass_filenames: false
      - id: dash-backend-pytest
        name: Pytest (dash backend)
        entry: uv run --project deployments/applications/services/dash/backend pytest deployments/applications/services/dash/backend/tests
        language: system
        # tiles.json is in the pattern because the suite parses the shipped
        # config; scoped to the backend alone, a bad tile would skip the gate.
        files: '^deployments/applications/services/dash/(backend/|tiles\.json$)'
        pass_filenames: false
      # registry-ui carries the same four hooks as dash, for the same reason:
      # its own uv project, so its own interpreter and config. Its frontend
      # holds no Python, so it needs none.
      - id: registry-ui-backend-ruff
        name: Ruff (lint, registry-ui backend)
        entry: uv run --project deployments/applications/services/registry-ui/backend ruff check --force-exclude
        language: system
        types: [python]
        files: '^deployments/applications/services/registry-ui/backend/'
      - id: registry-ui-backend-ruff-format
        name: Ruff (format, registry-ui backend)
        entry: uv run --project deployments/applications/services/registry-ui/backend ruff format --check --force-exclude
        language: system
        types: [python]
        files: '^deployments/applications/services/registry-ui/backend/'
      - id: registry-ui-backend-mypy
        name: Mypy (strict, registry-ui backend)
        entry: uv run --project deployments/applications/services/registry-ui/backend mypy --config-file deployments/applications/services/registry-ui/backend/pyproject.toml deployments/applications/services/registry-ui/backend/src deployments/applications/services/registry-ui/backend/tests
        language: system
        files: '^deployments/applications/services/registry-ui/backend/'
        pass_filenames: false
      - id: registry-ui-backend-pytest
        name: Pytest (registry-ui backend)
        entry: uv run --project deployments/applications/services/registry-ui/backend pytest deployments/applications/services/registry-ui/backend/tests
        language: system
        files: '^deployments/applications/services/registry-ui/backend/'
        pass_filenames: false
