---
# The HashiStack versions this cluster runs. This is the single place they
# are declared: the apt pin and the install task both read from here, so
# moving a version is one edit.
#
# These match what is installed on every node. Changing a value here
# schedules an upgrade on the next run, so change one at a time and follow
# the matching runbook.
hashistack_versions:
  consul: 2.0.2-1
  vault: 2.0.3-1
  nomad: 2.0.4-1
  nomad-driver-podman: 0.6.4-1
