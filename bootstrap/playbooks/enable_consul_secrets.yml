---
# Stand up Vault's Consul secrets engine so `vault read consul/creds/deploy`
# mints short-lived, least-privilege Consul ACL tokens for the Terraform
# deployer (F6). Everything here needs the Consul management token, which the
# config-split invariant keeps out of Terraform: Ansible owns the engine mount,
# its config/access, AND the scoped `deploy` Consul ACL policy; Terraform owns
# only the Vault role that references the policy by name. Runs after
# seed_vault.yml, once both /opt/vault/init.json and /opt/consul/bootstrap_token
# exist on the manager.
- name: Enable and configure Vault's Consul secrets engine
  hosts: manager
  become: true

  tasks:
    - name: Read Vault init keys
      ansible.builtin.slurp:
        src: /opt/vault/init.json
      register: vault_init_keys

    - name: Parse Vault root token
      ansible.builtin.set_fact:
        vault_root_token: "{{ (vault_init_keys['content'] | b64decode | from_json).root_token }}"

    - name: Read the stored Consul bootstrap token
      ansible.builtin.slurp:
        src: /opt/consul/bootstrap_token
      register: stored_bootstrap_token

    - name: Set master_consul_token fact
      ansible.builtin.set_fact:
        master_consul_token: "{{ stored_bootstrap_token['content'] | b64decode }}"

    # The deployer's real Consul footprint, and no more: write on the
    # terraform/ state-KV prefix (state for both roots) plus its state-lock
    # sessions, and read on the two services the applications root looks up.
    # node_prefix read is required for the consul_service catalog reads to
    # return node addresses (used at applications/providers.tf:41,47); it is
    # strictly read. No management, no global write, no acl access.
    - name: Create the scoped deploy Consul ACL policy
      community.general.consul_policy:
        name: "deploy"
        rules: |
          key_prefix "terraform/" {
            policy = "write"
          }
          session_prefix "" {
            policy = "write"
          }
          service "minio" {
            policy = "read"
          }
          service "postgres-db" {
            policy = "read"
          }
          node_prefix "" {
            policy = "read"
          }
        token: "{{ master_consul_token }}"

    - name: Check if Consul secrets engine is enabled
      ansible.builtin.command:
        cmd: vault secrets list -format=json
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_root_token }}"
      register: vault_secrets_list_for_check
      changed_when: false

    - name: Enable Consul secrets engine
      ansible.builtin.command:
        cmd: vault secrets enable -path=consul consul
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_root_token }}"
      when: "'consul/' not in (vault_secrets_list_for_check.stdout | from_json)"
      changed_when: true

    # Vault holds the Consul management token so it can mint scoped child
    # tokens on demand; the token itself is never readable back out.
    - name: Configure Consul secrets engine access
      ansible.builtin.command:
        cmd: >
          vault write consul/config/access
          address="127.0.0.1:8500"
          token="{{ master_consul_token }}"
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_root_token }}"
      changed_when: true
      no_log: true
