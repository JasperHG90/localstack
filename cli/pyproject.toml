[project]
name = "localstack-cli"
version = "0.1.0"
description = "Cockpit for the localstack home-lab cluster"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.0",
]

[project.scripts]
localstack = "localstack_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that touch the real cluster carry this marker. D1 adds none; D2 to D5
# will. Excluded from the default run by addopts below, so `uv run pytest`
# stays fast and offline. Run them on purpose with `-m cluster`.
markers = [
    "cluster: hits the live cluster (network, real Vault/Nomad/Consul)",
]
addopts = "-m 'not cluster'"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Defaults (E, F) plus import ordering. A noisy first gate is a gate people
# learn to skip; this can tighten later at low cost.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
