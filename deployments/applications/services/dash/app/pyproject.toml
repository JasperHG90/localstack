[project]
name = "dash-app"
version = "0.1.0"
description = "Status backend and frontend for the localstack cluster landing page"
requires-python = ">=3.12"
dependencies = [
    "localstack-cli",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
dash-app = "dash_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dash_app"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same shape as cli/pyproject.toml: a test that needs the live cluster
# carries this marker and stays excluded from the default run.
markers = [
    "cluster: hits the live cluster (network, real Vault/Nomad/Consul)",
]
addopts = "-m 'not cluster'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

# cli/ ships no py.typed marker and this ticket does not touch cli/ (its
# code surface is elsewhere), so mypy cannot see localstack_cli's own
# (separately strict-checked) annotations from here. This scopes the
# exemption to that one package rather than weakening strict mode for
# this project's own code.
[[tool.mypy.overrides]]
module = "localstack_cli.*"
ignore_missing_imports = true

[tool.uv.sources]
localstack-cli = { path = "../../../../../cli", editable = true }
