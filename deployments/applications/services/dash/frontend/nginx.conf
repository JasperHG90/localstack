# Listens on the frontend task's own port (dash.hcl's group-level `http`
# port, 8000) rather than nginx's image default of 80: the job runs with
# `network_mode = "host"`, so the container's listen port IS the host port.
server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
