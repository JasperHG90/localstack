# Listens on the frontend task's own port (registry-ui.hcl's group-level
# `http` port, 8002) rather than nginx's image default of 80: the job runs
# with `network_mode = "host"`, so the container's listen port IS the host
# port, and oauth2-proxy-registry-ui dials 8002 on loopback.
server {
    listen 8002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
