apiVersion: 1
groups:
  - orgId: 1
    name: cluster-health
    folder: Alerts
    interval: 1m
    rules:
      - uid: alert-node-down
        title: NodeDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="node"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: node }
        annotations:
          summary: "Node {{ $labels.instance }} is DOWN"
          description: "node-exporter on {{ $labels.instance }} unreachable for 5m. Check power, network, ufw, systemd unit."

      - uid: alert-nomad-blocked-evals
        title: NomadBlockedEvaluations
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'sum(nomad_client_allocations_blocked)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: nomad }
        annotations:
          summary: "Nomad has {{ $value }} blocked evaluations"
          description: "Scheduler can't place allocs (resource exhaustion, constraints, missing host volumes). Run `nomad eval list -status=blocked`."

      - uid: alert-nomad-server-down
        title: NomadServerDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="nomad"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: nomad }
        annotations:
          summary: "Nomad server on firebat unreachable"
          description: "Cluster control plane is down. Inspect `systemctl status nomad` on firebat."

      - uid: alert-consul-down
        title: ConsulDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="consul"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: consul }
        annotations:
          summary: "Consul on firebat unreachable"
          description: "Service discovery + Vault auth depend on this. Check the consul agent."

      - uid: alert-postgres-down
        title: PostgresDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'pg_up == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: postgres }
        annotations:
          summary: "Postgres on firebat is unreachable"
          description: "postgres_exporter pg_up=0 for 5m. Check postgres alloc, port 5432, disk on firebat."

      - uid: alert-postgres-scrape-down
        title: PostgresScrapeDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="postgres"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: postgres }
        annotations:
          summary: "Postgres exporter scrape is failing"
          description: "Prometheus cannot scrape postgres-exporter on firebat:9187 for 5m (up=0). This fires when the scrape itself times out or the exporter is down — PostgresDown (pg_up) stays silent in that case because pg_up is absent without a successful scrape. Check the exporter sidecar alloc, the listen binding on 192.168.2.30:9187, and firebat ufw (allow 192.168.2.47 to 9187, known to drift after a ufw apply)."

      - uid: alert-minio-degraded
        title: MinIOClusterDegraded
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'minio_cluster_nodes_offline_total > 0 or absent(minio_cluster_nodes_online_total)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: minio }
        annotations:
          summary: "MinIO degraded on orangepi4a"
          description: "Offline nodes reported or metrics absent. Check MinIO alloc + minio_data host volume."

      - uid: alert-haproxy-down
        title: HAProxyDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'absent(haproxy_process_start_time_seconds)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: haproxy }
        annotations:
          summary: "HAProxy on firebat appears down"
          description: "Stats endpoint (8404) unreachable for 5m — ingress is broken."

      - uid: alert-prometheus-down
        title: PrometheusDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="prometheus"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 3m
        labels: { severity: critical, component: prometheus }
        annotations:
          summary: "Prometheus is not scraping itself"
          description: "If you see this, alerting is also at risk. Check Prometheus alloc on ubuntu."

      - uid: alert-node-cpu-high
        title: NodeCPUHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle",job="node"}[5m]))) > 90'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, component: node }
        annotations:
          summary: "{{ $labels.instance }} CPU > 90% (sustained)"
          description: "5m avg CPU on {{ $labels.instance }} = {{ printf \"%.1f\" $values.A.Value }}% for 15m."

      - uid: alert-node-mem-high
        title: NodeMemoryHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 * (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) > 95'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: node }
        annotations:
          summary: "{{ $labels.instance }} memory > 95%"
          description: "Available memory below 5% on {{ $labels.instance }} for 10m. Usage: {{ printf \"%.1f\" $values.A.Value }}%. (Jetson runs at 90% by design — only fire above 95.)"

      - uid: alert-node-disk-low
        title: NodeDiskLow
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 * (node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"}) < 10'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, component: node }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} < 10% free"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has {{ printf \"%.1f\" $values.A.Value }}% free."

      - uid: alert-memex-log-errors
        title: MemexLogErrorBurst
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="nomad", task="memex"} |~ "(?i)\\b(error|exception|traceback|panic)\\b" [5m]))'
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 10m
        labels: { severity: warning, component: memex }
        annotations:
          summary: "Memex log error burst"
          description: ">20 error-like log lines in 5m, sustained 10m. Inspect Memex alloc logs."

      - uid: alert-bifrost-gateway-down
        title: BifrostGatewayDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              # == bool 0 yields 1 when the target is down (a plain `== 0`
              # returns value 0, which never trips the `gt 0` threshold).
              expr: 'up{job="bifrost"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: bifrost }
        annotations:
          summary: "Bifrost LLM gateway is unreachable"
          description: "Prometheus can't scrape Bifrost on 192.168.2.50:8080 for 5m. All LLM traffic routed through the gateway (e.g. memex) is failing. Check the bifrost alloc on radxa-dragon-q6a."

      - uid: alert-bifrost-provider-down
        title: BifrostProviderDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              # Every key of a provider reporting down => that provider is
              # fully unavailable (no in-provider fallback left).
              expr: 'sum by (provider) (bifrost_provider_key_up) == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: bifrost }
        annotations:
          summary: "Bifrost provider {{ $labels.provider }} has no healthy keys"
          description: "Every API key for provider {{ $labels.provider }} reports down for 5m — that provider is fully unavailable and requests to it will fail. Check the upstream provider status and the account keys."

      - uid: alert-bifrost-provider-key-down
        title: BifrostProviderKeyDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'bifrost_provider_key_up == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: bifrost }
        annotations:
          summary: "Bifrost key {{ $labels.key_name }} ({{ $labels.provider }}) is down"
          description: "Bifrost reports key {{ $labels.key_name }} for provider {{ $labels.provider }} unhealthy for 10m. Weighted fallback keys still cover traffic, so this is degraded-not-down. Check the upstream account/API key."

      - uid: alert-bifrost-memory-high
        title: BifrostMemoryHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              # Peak RSS for the bifrost alloc vs its 512 MiB limit. max_usage
              # is the high-water mark, so this is leading not flapping.
              expr: 'nomad_client_allocs_memory_max_usage{exported_job="bifrost"} / (512 * 1024 * 1024) * 100 > 80'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: bifrost }
        annotations:
          summary: "Bifrost alloc memory > 80% of limit"
          description: "Peak RSS on the bifrost alloc is {{ printf \"%.0f\" $values.A.Value }}% of its 512 MiB limit for 10m. Raise resources.memory in bifrost.hcl before it OOMs (exit 137)."

      - uid: alert-scrape-job-missing
        title: ScrapeJobMissing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'absent(up{job="node"}) or absent(up{job="nomad"}) or absent(up{job="consul"}) or absent(up{job="haproxy"}) or absent(up{job="postgres"}) or absent(up{job="minio"}) or absent(up{job="prometheus"}) or absent(up{job="bifrost"})'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical, component: prometheus }
        annotations:
          summary: "Scrape job '{{ $labels.job }}' has zero targets"
          description: "The '{{ $labels.job }}' Prometheus scrape job is missing entirely (no targets, or all dropped before scrape). This silently disables all per-target down-alerts for that job. Inspect http://192.168.2.47:9090/targets."
