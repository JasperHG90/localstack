apiVersion: 1
groups:
  - orgId: 1
    name: cluster-health
    folder: Alerts
    interval: 1m
    rules:
      - uid: alert-node-down
        title: NodeDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="node"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: node }
        annotations:
          summary: "Node {{ $labels.instance }} is DOWN"
          description: "node-exporter on {{ $labels.instance }} unreachable for 5m. Check power, network, ufw, systemd unit."

      - uid: alert-nomad-blocked-evals
        title: NomadBlockedEvaluations
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'sum(nomad_client_allocations_blocked)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: nomad }
        annotations:
          summary: "Nomad has {{ $value }} blocked evaluations"
          description: "Scheduler can't place allocs (resource exhaustion, constraints, missing host volumes). Run `nomad eval list -status=blocked`."

      - uid: alert-nomad-server-down
        title: NomadServerDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="nomad"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: nomad }
        annotations:
          summary: "Nomad server on firebat unreachable"
          description: "Cluster control plane is down. Inspect `systemctl status nomad` on firebat."

      - uid: alert-consul-down
        title: ConsulDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="consul"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: consul }
        annotations:
          summary: "Consul on firebat unreachable"
          description: "Service discovery + Vault auth depend on this. Check the consul agent."

      - uid: alert-postgres-down
        title: PostgresDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'pg_up == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: postgres }
        annotations:
          summary: "Postgres on firebat is unreachable"
          description: "postgres_exporter pg_up=0 for 5m. Check postgres alloc, port 5432, disk on firebat."

      - uid: alert-postgres-scrape-down
        title: PostgresScrapeDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="postgres"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: postgres }
        annotations:
          summary: "Postgres exporter scrape is failing"
          description: "Prometheus cannot scrape postgres-exporter on firebat:9187 for 5m (up=0). This fires when the scrape itself times out or the exporter is down — PostgresDown (pg_up) stays silent in that case because pg_up is absent without a successful scrape. Check the exporter sidecar alloc, the listen binding on 192.168.2.30:9187, and firebat ufw (allow 192.168.2.47 to 9187, known to drift after a ufw apply)."

      - uid: alert-minio-degraded
        title: MinIOClusterDegraded
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'minio_cluster_nodes_offline_total > 0 or absent(minio_cluster_nodes_online_total)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: minio }
        annotations:
          summary: "MinIO degraded on orangepi4a"
          description: "Offline nodes reported or metrics absent. Check MinIO alloc + minio_data host volume."

      - uid: alert-haproxy-down
        title: HAProxyDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'absent(haproxy_process_start_time_seconds)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: haproxy }
        annotations:
          summary: "HAProxy on firebat appears down"
          description: "Stats endpoint (8404) unreachable for 5m — ingress is broken."

      - uid: alert-prometheus-down
        title: PrometheusDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'up{job="prometheus"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 3m
        labels: { severity: critical, component: prometheus }
        annotations:
          summary: "Prometheus is not scraping itself"
          description: "If you see this, alerting is also at risk. Check Prometheus alloc on ubuntu."

      - uid: alert-node-cpu-high
        title: NodeCPUHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle",job="node"}[5m]))) > 90'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, component: node }
        annotations:
          summary: "{{ $labels.instance }} CPU > 90% (sustained)"
          description: "5m avg CPU on {{ $labels.instance }} = {{ printf \"%.1f\" $values.A.Value }}% for 15m."

      - uid: alert-node-mem-high
        title: NodeMemoryHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 * (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) > 95'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: node }
        annotations:
          summary: "{{ $labels.instance }} memory > 95%"
          description: "Available memory below 5% on {{ $labels.instance }} for 10m. Usage: {{ printf \"%.1f\" $values.A.Value }}%. (Jetson runs at 90% by design — only fire above 95.)"

      - uid: alert-node-disk-low
        title: NodeDiskLow
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '100 * (node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs"}) < 10'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, component: node }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} < 10% free"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has {{ printf \"%.1f\" $values.A.Value }}% free."

      - uid: alert-memex-log-errors
        title: MemexLogErrorBurst
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="nomad", task="memex"} |~ "(?i)\\b(error|exception|traceback|panic)\\b" [5m]))'
              queryType: instant
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 10m
        labels: { severity: warning, component: memex }
        annotations:
          summary: "Memex log error burst"
          description: ">20 error-like log lines in 5m, sustained 10m. Inspect Memex alloc logs."

      - uid: alert-bifrost-gateway-down
        title: BifrostGatewayDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              # == bool 0 yields 1 when the target is down (a plain `== 0`
              # returns value 0, which never trips the `gt 0` threshold).
              expr: 'up{job="bifrost"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: bifrost }
        annotations:
          summary: "Bifrost LLM gateway is unreachable"
          description: "Prometheus can't scrape Bifrost on 192.168.2.50:8080 for 5m. All LLM traffic routed through the gateway (e.g. memex) is failing. Check the bifrost alloc on radxa-dragon-q6a."

      - uid: alert-bifrost-provider-down
        title: BifrostProviderDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              # Every key of a provider reporting down => that provider is
              # fully unavailable (no in-provider fallback left).
              expr: 'sum by (provider) (bifrost_provider_key_up) == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, component: bifrost }
        annotations:
          summary: "Bifrost provider {{ $labels.provider }} has no healthy keys"
          description: "Every API key for provider {{ $labels.provider }} reports down for 5m — that provider is fully unavailable and requests to it will fail. Check the upstream provider status and the account keys."

      - uid: alert-bifrost-provider-key-down
        title: BifrostProviderKeyDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'bifrost_provider_key_up{key_name!~"ollama-(proton|rituals)"} == bool 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: bifrost }
        annotations:
          summary: "Bifrost key {{ $labels.key_name }} ({{ $labels.provider }}) is down"
          description: "Bifrost reports key {{ $labels.key_name }} for provider {{ $labels.provider }} unhealthy for 10m. Weighted fallback keys still cover traffic, so this is degraded-not-down. Check the upstream account/API key."

      - uid: alert-bifrost-memory-high
        title: BifrostMemoryHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              # Peak RSS for the bifrost alloc vs its 512 MiB limit. max_usage
              # is the high-water mark, so this is leading not flapping.
              expr: 'nomad_client_allocs_memory_max_usage{exported_job="bifrost"} / (512 * 1024 * 1024) * 100 > 80'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: bifrost }
        annotations:
          summary: "Bifrost alloc memory > 80% of limit"
          description: "Peak RSS on the bifrost alloc is {{ printf \"%.0f\" $values.A.Value }}% of its 512 MiB limit for 10m. Raise resources.memory in bifrost.hcl before it OOMs (exit 137)."

      - uid: alert-tempo-memory-high
        title: TempoMemoryHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              # Peak RSS for the tempo alloc vs its 768 MiB limit. max_usage is
              # the high-water mark, so this leads the OOM rather than flapping.
              expr: 'nomad_client_allocs_memory_max_usage{exported_job="tempo"} / (768 * 1024 * 1024) * 100 > 80'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: tempo }
        annotations:
          summary: "Tempo alloc memory > 80% of limit"
          description: "Peak RSS on the tempo alloc is {{ printf \"%.0f\" $values.A.Value }}% of its 768 MiB limit for 10m. Unlike bifrost, do NOT raise resources.memory: tempo shares a Pi 4B with prometheus, loki, grafana and alloy, so there is nothing to raise it with. Lower GOMEMLIMIT in tempo.hcl instead."

      # The counter tempo.hcl said to watch when the metrics generator shipped
      # on 2026-09-08. Nothing alerted on it, so the 09-10 OOM loop ran for a
      # day until a human noticed traces had stopped.
      - uid: alert-tempo-oom-killed
        title: TempoOOMKilled
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'increase(nomad_client_allocs_oom_killed{exported_job="tempo"}[15m]) > 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        # No `for`: the kill already happened and the 15m increase() window
        # smooths it. Waiting would only delay the page.
        for: 0m
        labels: { severity: critical, component: tempo }
        annotations:
          summary: "Tempo was OOM-killed"
          description: "The tempo task was killed by the kernel (exit 137) in the last 15m. It restarts twice, then the alloc fails and traces stop cluster-wide. Lower GOMEMLIMIT in tempo.hcl; do not raise resources.memory, there is nothing on that node to raise it with."

      # The generator's live-trace map is bounded only by max_live_traces, and
      # exceeding it drops traces rather than slowing ingest. This is what that
      # looks like from outside. See the paragraph in tempo.hcl for why the
      # byte cap is not available as an alternative.
      - uid: alert-tempo-traces-dropped
        title: TempoTracesDropped
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'increase(tempo_metrics_generator_processor_local_blocks_traces_dropped_total{reason="live_traces_exceeded"}[10m]) > 0'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, component: tempo }
        annotations:
          summary: "Tempo is dropping traces at the live-trace cap"
          description: "The local-blocks generator dropped traces for tenant {{ $labels.tenant }} because max_live_traces (5000) was exceeded, so TraceQL metrics are now computed over an incomplete sample. Raise it in tempo.hcl only while TempoMemoryHigh is quiet: that cap is the only thing bounding the generator's live-trace map."

      - uid: alert-scrape-job-missing
        title: ScrapeJobMissing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'absent(up{job="node"}) or absent(up{job="nomad"}) or absent(up{job="consul"}) or absent(up{job="haproxy"}) or absent(up{job="postgres"}) or absent(up{job="minio"}) or absent(up{job="prometheus"}) or absent(up{job="bifrost"}) or absent(up{job="openviking"}) or absent(up{job="driftwatch"})'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical, component: prometheus }
        annotations:
          summary: "Scrape job '{{ $labels.job }}' has zero targets"
          description: "The '{{ $labels.job }}' Prometheus scrape job is missing entirely (no targets, or all dropped before scrape). This silently disables all per-target down-alerts for that job. Inspect http://192.168.2.47:9090/targets."

  - orgId: 1
    name: retrieval-quality
    folder: Alerts
    interval: 5m
    rules:
      # Every rule in this group compares today against the last fortnight
      # rather than against a fixed floor. A canary set says nothing about the
      # number a healthy model should reach -- 60 documents of embark's own
      # docs is not a benchmark -- and everything about whether the number
      # moved. A fixed floor here would be a guess that either never fires or
      # fires forever.
      #
      # `for` is 26h on the trend rules because the canary runs daily
      # (DRIFTWATCH_INTERVAL_SECONDS in services/driftwatch.hcl). That is the
      # blog's "two consecutive runs, not one anomaly", expressed in the unit
      # Grafana understands.
      - uid: alert-canary-recall-drop
        title: CanaryRecallDrop
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1209600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'driftwatch_recall{stage="embedding", k="10"} < bool (0.95 * avg_over_time(driftwatch_recall{stage="embedding", k="10"}[14d]))'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 26h
        labels: { severity: warning, component: retrieval }
        annotations:
          summary: "Canary recall@10 is more than 5% below its 14-day average"
          description: "Two consecutive daily runs have ranked the canary answers worse than the fortnight before them. The embedding model, its quantization, or its prefixes changed. Compare driftwatch_reference_cosine_mean on /d/localstack-retrieval-quality: a cosine drop alongside this says the model changed, a stable cosine says the ranking moved without the vectors moving."

      - uid: alert-embedding-model-drift
        title: EmbeddingModelDrift
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'driftwatch_reference_cosine_mean < bool 0.92'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: critical, component: retrieval }
        annotations:
          summary: "Canary vectors have drifted from the baseline (cosine < 0.92)"
          description: "The served embedding model is producing different vectors for the same 60 documents than the ones the baseline recorded. Every vector already in Postgres was written by the OLD model, so the store is now mixing two embedding spaces. If the change was deliberate, re-embed the corpus and then delete /var/lib/driftwatch/baseline.npz on radxa to re-seed. A run with no baseline reports NaN, which does not fire this."

      - uid: alert-embedding-norms-unstable
        title: EmbeddingNormsUnstable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1209600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'driftwatch_embedding_norm_stddev > bool (2 * avg_over_time(driftwatch_embedding_norm_stddev[14d]))'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 26h
        labels: { severity: warning, component: retrieval }
        annotations:
          summary: "Canary vector lengths have twice the spread they had"
          description: "Vector magnitudes scattered. This is a preprocessing fault rather than a ranking one -- a dropped normalization, a truncation, a tokenizer that changed under the model -- and cosine is blind to all three, so no other alert here will catch it."

      - uid: alert-rerank-demotes-answers
        title: RerankDemotesAnswers
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'driftwatch_recall{stage="pipeline", k="1"} < bool ignoring(stage) driftwatch_recall{stage="embedding", k="1"}'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 26h
        labels: { severity: warning, component: retrieval }
        annotations:
          summary: "The reranker is ranking worse than the shortlist it was given"
          description: "Both stages see the same top 10, and the cross-encoder is putting the answer lower than cosine already had it. Two consecutive runs, so the reranker is costing latency and quality at once. Check driftwatch_recall{stage=\"rerank\"} next: that stage scores a pool the embedder never touched, so if it fell too the reranker itself regressed, and if it held the shortlist changed under it."

      - uid: alert-rerank-canary-drop
        title: RerankCanaryDrop
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1209600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'driftwatch_recall{stage="rerank", k="1"} < bool (0.95 * avg_over_time(driftwatch_recall{stage="rerank", k="1"}[14d]))'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 26h
        labels: { severity: warning, component: retrieval }
        annotations:
          summary: "The reranker is ranking worse than it was, on a pool that never changed"
          description: "This stage scores ten candidates fixed in rerank-goldset.jsonl, so unlike the pipeline number it cannot move because the embedder moved. Two consecutive runs below the fortnight means the rerank model itself regressed. RerankDemotesAnswers will stay quiet through this whenever the reranker is still beating a bare cosine ordering, which is why this rule exists separately."

      - uid: alert-pipeline-recall-drop
        title: PipelineRecallDrop
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1209600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'driftwatch_recall{stage="pipeline", k="1"} < bool (0.95 * avg_over_time(driftwatch_recall{stage="pipeline", k="1"}[14d]))'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 26h
        labels: { severity: warning, component: retrieval }
        annotations:
          summary: "What a caller actually receives got worse"
          description: "The pipeline stage is the delivered result: the embedder's top 10 reordered by the cross-encoder. It is the number that maps to what someone asking OpenViking a question gets back, and the other two rerank rules can both miss a drop in it. RerankCanaryDrop watches a fixed pool, so it cannot see the reranker degrading on the live shortlist's distractors. RerankDemotesAnswers only fires once the reranker is ranking WORSE than bare cosine, so a reranker that is still net-positive but less so moves neither. Read this beside embedding and rerank on /d/localstack-retrieval-quality: if both of those held, the reranker got worse on inputs only the embedder produces."

      - uid: alert-neighbor-overlap-rising
        title: NeighborOverlapRising
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1209600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'driftwatch_neighbor_overlap > bool (1.25 * avg_over_time(driftwatch_neighbor_overlap[14d]))'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 26h
        labels: { severity: warning, component: retrieval }
        annotations:
          summary: "Unrelated canary queries are retrieving the same documents"
          description: "The top-10 sets of different queries overlap a quarter more than they did over the fortnight. The embedder is losing the ability to tell the queries apart, which shows here before it shows in recall."

      - uid: alert-canary-stale
        title: CanaryStale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '(time() - driftwatch_last_success_timestamp_seconds) > bool 172800'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning, component: retrieval }
        annotations:
          summary: "No successful canary run in 48 hours"
          description: "Every quality number on /d/localstack-retrieval-quality is stale, and the drift alerts beside them are comparing today against a fortnight that stopped moving. A driftwatch that has never succeeded reads the same way, because the gauge starts at 0. Check driftwatch_runs_total{outcome=\"error\"} and the task logs."

      - uid: alert-openviking-rerank-fallback
        title: OpenVikingRerankFallback
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 'sum(rate(openviking_retrieval_rerank_fallback_total[1h]) or vector(0)) / clamp_min(sum(rate({__name__=~"openviking_retrieval_rerank_(used|fallback)_total"}[1h]) or vector(0)), 0.0001) > bool 0.05'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, component: openviking }
        annotations:
          summary: "More than 5% of live retrievals fell back to vector order"
          description: "OpenViking asked for a rerank and did not get one, so those results were served in cosine order. Nothing errors when this happens and no HTTP status reports it -- the answers are just worse. The rerank path is embark through Bifrost; check both."

      - uid: alert-openviking-no-candidates
        title: OpenVikingNoCandidates
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '(sum(rate(openviking_vector_scanned_total[1h]) or vector(0)) / clamp_min(sum(rate(openviking_retrieval_requests_total[1h])), 0.0001) < bool 1) and (sum(rate(openviking_retrieval_requests_total[1h])) > 0.005)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: critical, component: openviking }
        annotations:
          summary: "Vector search is handing back no candidates at all"
          description: "This is the zero-result case that is NOT a content gap. openviking_vector_scanned_total counts what each descent step returned (hierarchical_retriever.py counts len(quick_results)), so a populated store hands back candidates that then score badly, while an empty or wrongly-scoped one hands back nothing. Fewer than one candidate per retrieval means the search is running against an empty collection. Likeliest cause is account scoping: OpenViking resolves ov_account from the JWT claim and an account that was never created returns 200 over an empty tree. Check openviking_retrieval_backend_readiness and the Postgres collection next. Caveat: if a future OpenViking stops emitting the telemetry summary this metric reads, the series goes absent and this fires on nothing."

      - uid: alert-openviking-zero-results
        title: OpenVikingZeroResults
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: '(sum(rate(openviking_retrieval_zero_result_total[1h])) / clamp_min(sum(rate(openviking_retrieval_requests_total[1h])), 0.0001) > bool clamp_min(1.5 * (sum(rate(openviking_retrieval_zero_result_total[14d])) / clamp_min(sum(rate(openviking_retrieval_requests_total[14d])), 0.0001)), 0.10)) and (sum(rate(openviking_retrieval_requests_total[1h])) > 0.005)'
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, component: openviking }
        annotations:
          summary: "Empty retrievals have jumped well above their own fortnight"
          description: "A zero result is often CORRECT: nobody ingested anything that answers that question. This metric cannot tell a correct empty from a broken one, so the level says nothing and only the CHANGE does. This fires when the last hour is half again worse than the trailing fortnight and above 10% in absolute terms, with at least ~18 requests in the hour so the ratio means something. It still cannot distinguish content being deleted from retrieval breaking, because no metric here records an ingest. OpenVikingNoCandidates is the unambiguous half; check it first."
